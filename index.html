<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Simulator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
body{
  width:100vw;height:100vh;overflow:hidden;background:#151515;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  user-select:none;
}
.screen{
  position:absolute;inset:0;width:100%;height:100%;overflow:hidden;
}
.status{
  height:47px;padding:11px 21px 0;
  display:flex;justify-content:space-between;
  font-size:14px;font-weight:600;
}

/* LOCK */
#lock{
  z-index:100;color:white;
  background:linear-gradient(rgba(0,0,0,.06),rgba(0,0,0,.17)),
  linear-gradient(155deg,#91b6d4,#c9bad1 55%,#deb6b0);
  transition:.45s;
}
#lock.hide{transform:translateY(-100%);opacity:0;pointer-events:none;}
.lockSymbol{text-align:center;margin-top:15px;font-size:18px}
.lockDate{text-align:center;font-size:19px;margin-top:23px}
.lockTime{text-align:center;font-size:79px;font-weight:200;letter-spacing:-5px}
.notification{
  width:calc(100% - 28px);margin:43px auto 0;padding:12px 14px;
  background:rgba(245,245,245,.84);backdrop-filter:blur(20px);
  border-radius:17px;color:#111;
}
.notTop{display:flex;align-items:center;font-size:12px;color:#666;margin-bottom:7px}
.notIcon{
  width:23px;height:23px;border-radius:6px;background:#fee500;
  display:flex;align-items:center;justify-content:center;margin-right:7px
}
.notName{font-size:15px;font-weight:600}
.notText{font-size:14px;margin-top:2px}
.lockBottom{position:absolute;bottom:10px;width:100%;text-align:center}
.swipe{font-size:13px;margin-bottom:22px}
.homebar{width:134px;height:5px;background:white;border-radius:5px;margin:auto}

/* HOME */
#home{
  z-index:1;color:white;
  background:linear-gradient(rgba(0,0,0,.04),rgba(0,0,0,.14)),
  linear-gradient(155deg,#91b6d4,#c9bad1 55%,#deb6b0);
}
.apps{
  padding:29px 21px;display:grid;
  grid-template-columns:repeat(4,1fr);gap:27px 17px;
}
.app{text-align:center;cursor:pointer}
.appIcon{
  width:61px;height:61px;border-radius:14px;margin:auto;
  display:flex;align-items:center;justify-content:center;font-size:27px
}
.appName{font-size:11px;margin-top:6px;text-shadow:0 1px 3px #555}
.kakaoIcon{background:#fee500;color:#111}
.instaIcon{background:linear-gradient(145deg,#7251ee,#dd328a,#ff9a3d)}
.photoIcon{background:white}
.greenIcon{background:#36ce57}
.dock{
  position:absolute;left:12px;right:12px;bottom:17px;height:87px;
  border-radius:26px;background:rgba(255,255,255,.29);
  backdrop-filter:blur(22px);display:flex;align-items:center;
  justify-content:space-around;
}

/* CHAT LIST */
#chatList{display:none;z-index:10;background:white;color:#111}
.listHeader{
  height:60px;padding:5px 18px 12px;
  display:flex;align-items:flex-end;
}
.listHeader h1{font-size:23px}
.listTools{margin-left:auto;font-size:20px}
.chatItem{
  height:77px;display:flex;align-items:center;
  padding:9px 16px;cursor:pointer;
}
.profile{
  width:55px;height:55px;border-radius:20px;
  object-fit:cover;background:#eee;
}
.listText{margin-left:12px;flex:1;min-width:0}
.listName{font-size:16px;font-weight:600;margin-bottom:5px}
.listPreview{
  font-size:13px;color:#888;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.listTime{font-size:11px;color:#aaa}
.chatTabs{
  position:absolute;bottom:0;width:100%;height:75px;
  border-top:1px solid #eee;background:#fafafa;
  display:flex;justify-content:space-around;align-items:center;
}
.tab{text-align:center;font-size:10px;cursor:pointer}
.tab div{font-size:22px;margin-bottom:3px}

/* ROOM */
#room{display:none;z-index:20;background:#b2c7d9}
.roomHeader{
  height:53px;display:flex;align-items:center;padding:0 14px;
}
.back{font-size:34px;width:38px;font-weight:200;cursor:pointer}
.roomName{font-size:17px;font-weight:600}
.roomTools{margin-left:auto;display:flex;gap:20px;font-size:21px}
#chat{
  height:calc(100% - 47px - 53px - 58px);
  overflow-y:auto;padding:8px 12px 25px;
  -webkit-overflow-scrolling:touch;
}
.dateDivider{text-align:center;margin:8px 0 20px}
.dateDivider span{
  display:inline-block;padding:5px 12px;border-radius:14px;
  background:rgba(0,0,0,.11);color:white;font-size:11px;
}
.themGroup{display:flex;align-items:flex-start;margin-bottom:13px}
.chatProfile{
  width:39px;height:39px;border-radius:14px;
  object-fit:cover;margin-right:7px;
}
.themContent{max-width:75%}
.sender{font-size:12px;margin-bottom:5px}
.themMessage{display:flex;align-items:flex-end;margin-bottom:4px}
.bubble{
  max-width:245px;padding:8px 10px;font-size:14px;
  line-height:1.42;word-break:keep-all;
}
.themMessage .bubble{background:white;border-radius:3px 10px 10px 10px}
.themMessage.follow .bubble{border-radius:10px}
.meMessage{
  display:flex;justify-content:flex-end;
  align-items:flex-end;margin:5px 0;
}
.meMessage .bubble{background:#fee500;border-radius:10px 3px 10px 10px}
.meta{
  display:flex;flex-direction:column;justify-content:flex-end;
  margin:0 5px 1px;min-width:33px;
}
.meMessage .meta{align-items:flex-end}
.unread{font-size:10px;color:#f1d900}
.time{font-size:9px;color:#5f6b73;white-space:nowrap}

/* COMPOSER */
.composer{
  position:absolute;bottom:0;width:100%;min-height:58px;
  background:white;display:flex;align-items:center;
  padding:8px 9px 12px;gap:7px;
}
.plus{
  width:31px;height:31px;border:1px solid #aaa;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#777;font-size:23px;
}
.input{
  flex:1;min-height:37px;border:1px solid #ddd;border-radius:20px;
  padding:9px 13px;font-size:14px;color:#aaa;cursor:pointer;
}

/* CHOICES */
#choiceSheet{
  display:none;position:absolute;z-index:60;inset:0;
  background:rgba(0,0,0,.22);
}
.choicePanel{
  position:absolute;bottom:0;left:0;right:0;
  background:#f6f6f6;border-radius:20px 20px 0 0;
  padding:12px 12px 28px;
}
.handle{
  width:38px;height:4px;background:#ccc;
  border-radius:5px;margin:0 auto 12px;
}
.choiceTitle{text-align:center;color:#888;font-size:12px;margin-bottom:8px}
.choice{
  width:100%;border:0;background:white;border-radius:12px;
  padding:14px 10px;margin-bottom:7px;font-size:14px;
  cursor:pointer;
}

/* CALL */
#incomingCall{
  display:none;z-index:200;color:white;
  background:
    linear-gradient(rgba(20,20,20,.55),rgba(20,20,20,.78)),
    url('jaeyoon.jpg') center/cover;
}
.callBlur{
  position:absolute;inset:0;
  backdrop-filter:blur(28px);
  background:rgba(20,20,20,.30);
}
.callContent{
  position:relative;z-index:2;height:100%;
  text-align:center;padding-top:95px;
}
.callAvatar{
  width:105px;height:105px;border-radius:50%;
  object-fit:cover;margin-bottom:18px;
}
.callName{font-size:31px;font-weight:500}
.callType{font-size:15px;color:#ddd;margin-top:7px}
.callButtons{
  position:absolute;bottom:75px;left:0;right:0;
  display:flex;justify-content:space-around;
}
.callButtonWrap{font-size:13px}
.callButton{
  width:68px;height:68px;border-radius:50%;
  border:none;color:white;font-size:28px;
  margin-bottom:9px;cursor:pointer;
}
.reject{background:#ff3b30}
.answer{background:#34c759}

/* ACTIVE CALL */
#activeCall{
  display:none;z-index:210;color:white;
  background:
    linear-gradient(rgba(15,15,15,.58),rgba(15,15,15,.8)),
    url('jaeyoon.jpg') center/cover;
}
.activeBlur{
  position:absolute;inset:0;
  backdrop-filter:blur(30px);
  background:rgba(20,20,20,.3);
}
.activeContent{
  position:relative;z-index:2;text-align:center;
  padding-top:80px;height:100%;
}
.activeName{font-size:29px}
.callTimer{font-size:14px;margin-top:8px;color:#ddd}
.callDialogue{
  margin:80px 25px 0;padding:16px;
  border-radius:16px;background:rgba(0,0,0,.28);
  font-size:16px;line-height:1.5;min-height:60px;
}
.callChoices{
  position:absolute;left:15px;right:15px;bottom:125px;
}
.callChoice{
  width:100%;border:0;border-radius:18px;
  background:rgba(255,255,255,.9);
  padding:12px;margin:4px 0;font-size:13px;
}
.endCall{
  position:absolute;bottom:40px;left:50%;
  transform:translateX(-50%);
  width:68px;height:68px;border:0;border-radius:50%;
  background:#ff3b30;color:white;font-size:27px;
}

/* OTHER */
#other{
  display:none;z-index:30;background:#f7f7f7;
}
.otherHeader{
  height:60px;background:white;padding:18px;
  display:flex;align-items:flex-end;border-bottom:1px solid #eee;
}
.otherBody{text-align:center;padding-top:180px;color:#999}

.reset{
  position:absolute;right:15px;bottom:100px;
  font-size:10px;color:rgba(255,255,255,.65);
}

/* PC */
@media(min-width:600px){
  .screen{
    width:390px;height:844px;left:50%;top:50%;
    transform:translate(-50%,-50%);border-radius:42px;
  }
  #lock.hide{transform:translate(-50%,-150%)}
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen">
  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="apps">
    <div class="app" onclick="openKakao()">
      <div class="appIcon kakaoIcon">💬</div>
      <div class="appName">카카오톡</div>
    </div>

    <div class="app" onclick="openOther('Instagram')">
      <div class="appIcon instaIcon">◎</div>
      <div class="appName">Instagram</div>
    </div>

    <div class="app" onclick="openOther('사진')">
      <div class="appIcon photoIcon">🌈</div>
      <div class="appName">사진</div>
    </div>
  </div>

  <div class="dock">
    <div class="app" onclick="openOther('전화')">
      <div class="appIcon greenIcon">☎</div>
    </div>

    <div class="app" onclick="openOther('메시지')">
      <div class="appIcon greenIcon">●</div>
    </div>
  </div>

  <div class="reset" onclick="resetGame()">처음부터</div>
</div>

<!-- CHAT LIST -->
<div id="chatList" class="screen">
  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="listHeader">
    <h1>채팅</h1>
    <div class="listTools">⌕　⚙</div>
  </div>

  <div class="chatItem" onclick="openRoom()">
    <img src="jaeyoon.jpg" class="profile">

    <div class="listText">
      <div class="listName">재윤이</div>
      <div id="preview" class="listPreview">OO아 자?</div>
    </div>

    <div class="listTime">지금</div>
  </div>

  <div class="chatTabs">
    <div class="tab" onclick="goHome()"><div>⌂</div>홈</div>
    <div class="tab"><div>♙</div>친구</div>
    <div class="tab"><div>●</div>채팅</div>
    <div class="tab"><div>•••</div>더보기</div>
  </div>
</div>

<!-- ROOM -->
<div id="room" class="screen">
  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="roomHeader">
    <div class="back" onclick="backList()">‹</div>
    <div class="roomName">재윤이</div>
    <div class="roomTools"><span>⌕</span><span>☰</span></div>
  </div>

  <div id="chat"></div>

  <div class="composer">
    <div class="plus">＋</div>
    <div class="input" onclick="showChoices()">메시지 입력</div>
    <div>☺</div>
    <div>#</div>
  </div>

  <div id="choiceSheet">
    <div class="choicePanel">
      <div class="handle"></div>
      <div class="choiceTitle">보낼 메시지를 선택하세요</div>
      <div id="choiceButtons"></div>
    </div>
  </div>
</div>

<!-- INCOMING CALL -->
<div id="incomingCall" class="screen">
  <div class="callBlur"></div>

  <div class="callContent">
    <img src="jaeyoon.jpg" class="callAvatar">
    <div class="callName">재윤이</div>
    <div class="callType">휴대전화</div>

    <div class="callButtons">
      <div class="callButtonWrap">
        <button class="callButton reject" onclick="rejectCall()">✕</button>
        <div>거절</div>
      </div>

      <div class="callButtonWrap">
        <button class="callButton answer" onclick="answerCall()">☎</button>
        <div>응답</div>
      </div>
    </div>
  </div>
</div>

<!-- ACTIVE CALL -->
<div id="activeCall" class="screen">
  <div class="activeBlur"></div>

  <div class="activeContent">
    <div class="activeName">재윤이</div>
    <div id="callTimer" class="callTimer">00:00</div>

    <div id="callDialogue" class="callDialogue">
      여보세요?
    </div>

    <div id="callChoices" class="callChoices"></div>

    <button class="endCall" onclick="endCall()">☎</button>
  </div>
</div>

<!-- OTHER APP -->
<div id="other" class="screen">
  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="otherHeader">
    <span onclick="closeOther()" style="font-size:28px;margin-right:15px">‹</span>
    <strong id="otherTitle"></strong>
  </div>

  <div class="otherBody">이 앱은 다음에 만들 거야 :)</div>
</div>

<!-- LOCK -->
<div id="lock" class="screen">
  <div class="status">
    <span>SKT</span>
    <span>●●● 100%</span>
  </div>

  <div class="lockSymbol">🔒</div>
  <div id="date" class="lockDate"></div>
  <div class="lockTime clock">00:00</div>

  <div class="notification">
    <div class="notTop">
      <div class="notIcon">💬</div>
      카카오톡
      <span style="margin-left:auto">지금</span>
    </div>
    <div class="notName">재윤이</div>
    <div class="notText">OO아 자?</div>
  </div>

  <div class="lockBottom">
    <div class="swipe">위로 쓸어올려서 잠금 해제</div>
    <div class="homebar"></div>
  </div>
</div>

<script>

/* ---------- TIME ---------- */

function updateTime(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,"0");
  const m=String(now.getMinutes()).padStart(2,"0");

  document.querySelectorAll(".clock").forEach(
    el=>el.textContent=h+":"+m
  );

  const days=["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];

  document.getElementById("date").textContent=
    (now.getMonth()+1)+"월 "+now.getDate()+"일 "+days[now.getDay()];
}

updateTime();
setInterval(updateTime,1000);


/* ---------- LOCK ---------- */

const lock=document.getElementById("lock");
let startY=0;

lock.addEventListener("touchstart",e=>{
  startY=e.touches[0].clientY;
});

lock.addEventListener("touchend",e=>{
  if(startY-e.changedTouches[0].clientY>45) unlock();
});

lock.addEventListener("click",unlock);

function unlock(){
  lock.classList.add("hide");
}


/* ---------- NAV ---------- */

function openKakao(){
  document.getElementById("chatList").style.display="block";
}

function goHome(){
  document.getElementById("chatList").style.display="none";
}

function openRoom(){
  document.getElementById("room").style.display="block";
  renderStory();
}

function backList(){
  document.getElementById("room").style.display="none";
}

function openOther(name){
  document.getElementById("otherTitle").textContent=name;
  document.getElementById("other").style.display="block";
}

function closeOther(){
  document.getElementById("other").style.display="none";
}


/* ---------- STORY STATE ---------- */

let state=JSON.parse(localStorage.getItem("jaeyoonStory")) || {
  stage:0,
  affection:0,
  messages:[],
  choices:null,
  movie:false
};

function save(){
  localStorage.setItem("jaeyoonStory",JSON.stringify(state));
}

function timeNow(){
  return "지금";
}


/* ---------- MESSAGE ---------- */

function addThem(text){
  state.messages.push({who:"them",text:text,time:timeNow()});
  document.getElementById("preview").textContent=text;
  save();
  renderMessages();
}

function addMe(text){
  state.messages.push({who:"me",text:text,time:timeNow()});
  document.getElementById("preview").textContent=text;
  save();
  renderMessages();
}

function addDate(text){
  state.messages.push({who:"date",text:text});
  save();
  renderMessages();
}

function renderMessages(){
  const chat=document.getElementById("chat");
  chat.innerHTML="";

  state.messages.forEach((msg,index)=>{

    if(msg.who==="date"){
      const d=document.createElement("div");
      d.className="dateDivider";
      d.innerHTML="<span>"+msg.text+"</span>";
      chat.appendChild(d);
      return;
    }

    if(msg.who==="me"){
      const row=document.createElement("div");
      row.className="meMessage";

      row.innerHTML=`
        <div class="meta">
          <span class="time">${msg.time}</span>
        </div>
        <div class="bubble">${msg.text}</div>
      `;

      chat.appendChild(row);
      return;
    }

    const group=document.createElement("div");
    group.className="themGroup";

    group.innerHTML=`
      <img src="jaeyoon.jpg" class="chatProfile">
      <div class="themContent">
        <div class="sender">재윤이</div>
        <div class="themMessage">
          <div class="bubble">${msg.text}</div>
          <div class="meta">
            <span class="time">${msg.time}</span>
          </div>
        </div>
      </div>
    `;

    chat.appendChild(group);
  });

  setTimeout(()=>{
    chat.scrollTop=chat.scrollHeight;
  },30);
}


/* ---------- INITIAL STORY ---------- */

function renderStory(){

  if(state.messages.length===0){

    state.messages=[
      {who:"date",text:"어제"},
      {who:"them",text:"OO !! 집에 잘 들어갔어?",time:"오후 10:48"},
      {who:"me",text:"ㅋㅋㅋ 웅 방금 들어왔어",time:"오후 10:49"},
      {who:"them",text:"오늘 왜 그냥 갔어..?",time:"오후 10:50"},
      {who:"me",text:"어...? 너 친구들이랑 얘기하고 있길래 그냥 왔지..ㅜ",time:"오후 10:51"},
      {who:"them",text:"그래도 말은 하고 가지...",time:"오후 10:52"},
      {who:"them",text:"기다렸는데",time:"오후 10:52"},
      {who:"date",text:"오늘"},
      {who:"them",text:"OO아 자?",time:"오후 11:41"},
      {who:"them",text:"물어볼 게 있는데..",time:"오후 11:42"}
    ];

    state.stage=1;

    state.choices=[
      "웅?? 아직까지 안 자고 뭐해 ㅋㅋㅋ",
      "뭔데??",
      "아... 나 오늘 좀 피곤해서.. 보내놓으면 내일 읽을게ㅜ"
    ];

    save();
  }

  renderMessages();
}


/* ---------- CHOICES ---------- */

function showChoices(){

  if(!state.choices || state.choices.length===0) return;

  const buttons=document.getElementById("choiceButtons");
  buttons.innerHTML="";

  state.choices.forEach((text,index)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=text;
    b.onclick=()=>choose(index);
    buttons.appendChild(b);
  });

  document.getElementById("choiceSheet").style.display="block";
}

function setChoices(arr){
  state.choices=arr;
  save();
}

function hideChoices(){
  document.getElementById("choiceSheet").style.display="none";
}


/* ---------- STORY BRANCH ---------- */

function choose(n){

  hideChoices();

  const selected=state.choices[n];

  addMe(selected);

  /* 첫 선택 */

  if(state.stage===1){

    if(n===0){

      state.affection+=1;
      setChoices(null);

      setTimeout(()=>addThem("아니 그게..."),500);
      setTimeout(()=>addThem("생각이 좀 많아서 잠이 안 오네 ㅎㅎ"),1000);

      setTimeout(()=>{
        addThem("이번 주말에 뭐 해?");
        state.stage=2;
        setChoices([
          "나? 딱히 약속 없는데?",
          "친구 만나기로 했는데 왜??",
          "왜 ㅋㅋㅋ 나 만나려고?"
        ]);
      },1500);
    }

    if(n===1){

      setChoices(null);

      setTimeout(()=>addThem("아 그..."),500);
      setTimeout(()=>addThem("너 이번 주말에 시간 있어??"),1000);
      setTimeout(()=>addThem("아니"),1400);

      setTimeout(()=>{
        addThem("주말에 뭐 해?");
        state.stage=2;
        setChoices([

  }


  /* 피곤하다고 했던 다음 날 */

  if(state.stage===3){

    setChoices(null);

    if(n===0){

      setTimeout(()=>addThem("아 별건 아니고"),500);

  /* 영화 제안 */

  if(state.stage===4){

    setChoices(null);

    if(n===0){

      state.movie=true;
      state.affection+=2;

      setTimeout(()=>addThem("진짜??"),500);
      setTimeout(()=>addThem("잠깐만"),900);

function movieChoices(){

  state.stage=4;

  setChoices([
    "좋아 ㅎㅎ 뭐 볼 건데?",
    "엥 둘이??",
    "이번 주는 좀 힘들 것 같은데 ㅜㅜ"
  ]);

  save();
}


function saturday(){

  setTimeout(()=>{

    addDate("토요일");

    addThem("OO아");
    addThem("나 도착했어!!");
    addThem("천천히 와 ㅎㅎ");

    state.stage=5;

    setChoices([
      "엥 벌써?? 나 거의 다 왔어!! 쫌만 기다려줘..ㅜㅜ",
      "ㅋㅋㅋㅋㅋ 왜 이렇게 일찍 왔어",
      "헐 미안 ㅜㅜ 나 한 10분 늦을 것 같아"
    ]);

    save();

  },1800);
}


/* ---------- PHONE CALL ---------- */

function scheduleCall(){

  state.stage=6;
  setChoices(null);
  save();

  setTimeout(()=>{
    document.getElementById("incomingCall").style.display="block";
  },2500);
}


let timerInterval=null;
let callSeconds=0;

function answerCall(){

  document.getElementById("incomingCall").style.display="none";
  document.getElementById("activeCall").style.display="block";

  callSeconds=0;

  timerInterval=setInterval(()=>{

    callSeconds++;

    const min=String(Math.floor(callSeconds/60)).padStart(2,"0");
    const sec=String(callSeconds%60).padStart(2,"0");

    document.getElementById("callTimer").textContent=min+":"+sec;

  },1000);

  document.getElementById("callDialogue").textContent="여보세요?";

  setTimeout(()=>{
    document.getElementById("callDialogue").textContent=
      "OO아 어디쯤이야?";

    showCallChoices();
  },1200);
}


function showCallChoices(){

  const box=document.getElementById("callChoices");

  const arr=[
    "나 거의 다 왔어! 왜??",
    "ㅋㅋㅋㅋ 왜 벌써 전화해",
    "나 길 잘못 든 것 같아...ㅜㅜ"
  ];

  box.innerHTML="";

  arr.forEach((text,index)=>{

    const b=document.createElement("button");
    b.className="callChoice";
    b.textContent=text;
    b.onclick=()=>callChoice(index);

    box.appendChild(b);
  });
}


function callChoice(n){

  document.getElementById("callChoices").innerHTML="";

  if(n===0){

    state.affection+=1;

    document.getElementById("callDialogue").textContent=
      "아 진짜?";

    setTimeout(()=>{
      document.getElementById("callDialogue").textContent=
        "아니 그냥 어디쯤 왔나 궁금해서 ㅎㅎ";
    },1300);

    setTimeout(()=>{
      document.getElementById("callDialogue").textContent=
        "그럼 끊지 말고 와";
    },2800);
  }

  if(n===1){

    document.getElementById("callDialogue").textContent=
      "아니 ㅋㅋㅋㅋ";

    setTimeout(()=>{
      document.getElementById("callDialogue").textContent=
        "심심하잖아";
    },1200);

    setTimeout(()=>{
      document.getElementById("callDialogue").textContent=
        "올 때까지 통화해 ㅎㅎ";
    },2500);
  }

  if(n===2){

    document.getElementById("callDialogue").textContent=
      "어??";

    setTimeout(()=>{
      document.getElementById("callDialogue").textContent=
        "지금 어디야?";
    },1000);

    setTimeout(()=>{
      document.getElementById("callDialogue").textContent=
        "잠깐만 내가 그쪽으로 갈게";
    },2200);

    setTimeout(()=>{
      document.getElementById("callDialogue").textContent=
        "끊지 마";
    },3400);
  }

  save();
}


function rejectCall(){

  document.getElementById("incomingCall").style.display="none";

  setTimeout(()=>{
    addThem("왜 안 받아 ㅋㅋㅋ");
    addThem("어디쯤이야?");
  },800);

  state.affection-=1;
  save();
}


function endCall(){

  clearInterval(timerInterval);

  document.getElementById("activeCall").style.display="none";

  state.stage=7;
  save();
}


/* ---------- RESET ---------- */

function resetGame(){

  if(confirm("처음부터 다시 시작할까?")){
    localStorage.removeItem("jaeyoonStory");
    location.reload();
  }
}
