<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Simulator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      height: 100vh;
      overflow: hidden;
    }

    /* 잠금화면 */
    #lockscreen {
      width: 100%;
      height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.18)),
        linear-gradient(160deg, #a9c5df, #d9c4d7 55%, #e5c3bb);

      color: white;
      position: relative;
      text-align: center;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 600;
    }

    .lock-icon {
      font-size: 20px;
      margin-top: 25px;
    }

    .date {
      margin-top: 25px;
      font-size: 20px;
      font-weight: 500;
    }

    .time {
      font-size: 82px;
      line-height: 1;
      font-weight: 200;
      letter-spacing: -5px;
      margin-top: 5px;
    }

    /* 알림 */
    .notification {
      width: calc(100% - 28px);
      max-width: 430px;
      margin: 45px auto 0;
      padding: 14px;

      background: rgba(245,245,245,0.78);
      backdrop-filter: blur(18px);

      color: #111;
      border-radius: 18px;
      text-align: left;

      cursor: pointer;
    }

    .notification-top {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #555;
      margin-bottom: 7px;
    }

    .app-icon {
      width: 22px;
      height: 22px;
      background: #36c55f;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 12px;
    }

    .sender {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .message {
      font-size: 14px;
    }

    /* 아래 버튼 */
    .bottom {
      position: absolute;
      bottom: 25px;
      width: 100%;
    }

    .unlock {
      font-size: 14px;
      margin-bottom: 22px;
      opacity: .9;
    }

    .home-bar {
      width: 130px;
      height: 5px;
      background: white;
      border-radius: 10px;
      margin: auto;
    }

  </style>
</head>

<body>

  <div id="lockscreen">

    <div class="status-bar">
      <span>SKT</span>
      <span>●●● 100%</span>
    </div>

    <div class="lock-icon">🔒</div>

    <div class="date">11월 3일 화요일</div>

    <div class="time">23:27</div>

    <div class="notification" onclick="openMessage()">

      <div class="notification-top">
        <div class="app-icon">💬</div>
        메시지 · 지금
      </div>

      <div class="sender">JAKE</div>

      <div class="message">
        아직 안 자?
      </div>

    </div>


    <div class="bottom">

      <div class="unlock">
        위로 쓸어올려서 잠금 해제
      </div>

      <div class="home-bar"></div>

    </div>

  </div>


  <script>

    function openMessage() {
      alert("다음 단계에서 여기 누르면 메시지 앱으로 들어가게 만들 거야!");
    }

  </script>

</body>
</html>
