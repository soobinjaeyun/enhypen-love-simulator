<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>재윤이</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  user-select:none;
}

.phone{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

.status{
  height:47px;
  padding:12px 20px 0;
  display:flex;
  justify-content:space-between;
  font-size:14px;
  font-weight:600;
}

/* =========================
   LOCK SCREEN
========================= */

#lockScreen{
  z-index:100;
  color:white;
  background:
    linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.18)),
    linear-gradient(155deg,#8eb5d3,#cbbbd2 55%,#deb6b0);
  transition:transform .45s ease,opacity .35s ease;
}

#lockScreen.hidden{
  transform:translateY(-100%);
  opacity:0;
  pointer-events:none;
}

.lockIcon{
  text-align:center;
  margin-top:15px;
  font-size:19px;
}

.lockDate{
  text-align:center;
  margin-top:23px;
  font-size:19px;
}

.lockTime{
  text-align:center;
  font-size:79px;
  line-height:1.05;
  font-weight:200;
  letter-spacing:-5px;
}

.lockNotification{
  width:calc(100% - 28px);
  margin:43px auto 0;
  padding:12px 14px;
  border-radius:17px;
  color:#111;
  background:rgba(245,245,245,.83);
  backdrop-filter:blur(20px);
}

.notificationTop{
  display:flex;
  align-items:center;
  font-size:12px;
  color:#666;
  margin-bottom:7px;
}

.kakaoTiny{
  width:23px;
  height:23px;
  margin-right:7px;
  border-radius:6px;
  background:#fee500;
  display:flex;
  align-items:center;
  justify-content:center;
}

.notificationName{
  font-size:15px;
  font-weight:600;
}

.notificationMessage{
  margin-top:3px;
  font-size:14px;
}

.lockBottom{
  position:absolute;
  bottom:10px;
  width:100%;
  text-align:center;
}

.swipeText{
  margin-bottom:22px;
  font-size:13px;
}

.homeBar{
  width:134px;
  height:5px;
  margin:auto;
  border-radius:5px;
  background:white;
}

/* =========================
   HOME
========================= */

#homeScreen{
  z-index:1;
  color:white;
  background:
    linear-gradient(rgba(0,0,0,.04),rgba(0,0,0,.14)),
    linear-gradient(155deg,#8eb5d3,#cbbbd2 55%,#deb6b0);
}

.appGrid{
  padding:30px 21px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:28px 17px;
}

.app{
  text-align:center;
  cursor:pointer;
}

.appIcon{
  width:61px;
  height:61px;
  margin:auto;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.appLabel{
  margin-top:6px;
  font-size:11px;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
}

.kakaoIcon{background:#fee500;color:#111;}
.instagramIcon{
  background:linear-gradient(145deg,#7350ef,#d93b9c,#ff983d);
}
.photosIcon{background:#fff;}
.greenIcon{background:#34c759;}

.dock{
  position:absolute;
  left:12px;
  right:12px;
  bottom:17px;
  height:87px;
  border-radius:27px;
  background:rgba(255,255,255,.29);
  backdrop-filter:blur(22px);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

/* =========================
   KAKAO LIST
========================= */

#kakaoScreen{
  display:none;
  z-index:10;
  background:#fff;
  color:#111;
}

.kakaoHeader{
  height:58px;
  padding:5px 18px 12px;
  display:flex;
  align-items:flex-end;
}

.kakaoHeader h1{
  font-size:23px;
}

.kakaoTools{
  margin-left:auto;
  font-size:20px;
}

.chatItem{
  height:78px;
  padding:10px 16px;
  display:flex;
  align-items:center;
  cursor:pointer;
}

.profile{
  width:55px;
  height:55px;
  border-radius:20px;
  object-fit:cover;
  background:#ddd;
}

.chatListText{
  flex:1;
  min-width:0;
  margin-left:12px;
}

.chatListName{
  margin-bottom:5px;
  font-size:16px;
  font-weight:600;
}

.chatPreview{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:13px;
  color:#888;
}

.chatListTime{
  font-size:11px;
  color:#aaa;
}

.kakaoBottom{
  position:absolute;
  bottom:0;
  width:100%;
  height:75px;
  border-top:1px solid #eee;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:space-around;
}

.bottomTab{
  text-align:center;
  font-size:10px;
  cursor:pointer;
}

.bottomTabIcon{
  margin-bottom:3px;
  font-size:22px;
}

/* =========================
   CHAT ROOM
========================= */

#chatRoom{
  display:none;
  z-index:20;
  background:#b2c7d9;
  color:#111;
}

.roomHeader{
  height:53px;
  padding:0 14px;
  display:flex;
  align-items:center;
}

.backButton{
  width:38px;
  font-size:34px;
  font-weight:200;
  cursor:pointer;
}

.roomName{
  font-size:17px;
  font-weight:600;
}

.roomTools{
  margin-left:auto;
  display:flex;
  gap:19px;
  font-size:21px;
}

#messages{
  height:calc(100% - 47px - 53px - 58px);
  padding:8px 12px 25px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

.dateLine{
  margin:8px 0 20px;
  text-align:center;
}

.dateLine span{
  display:inline-block;
  padding:5px 12px;
  border-radius:14px;
  background:rgba(0,0,0,.11);
  color:white;
  font-size:11px;
}

.themRow{
  display:flex;
  align-items:flex-start;
  margin-bottom:11px;
}

.chatProfile{
  width:39px;
  height:39px;
  margin-right:7px;
  border-radius:14px;
  object-fit:cover;
}

.themBox{
  max-width:75%;
}

.sender{
  margin-bottom:5px;
  font-size:12px;
}

.bubbleLine{
  display:flex;
  align-items:flex-end;
}

.themBubble,
.meBubble{
  max-width:245px;
  padding:8px 10px;
  font-size:14px;
  line-height:1.42;
  word-break:keep-all;
}

.themBubble{
  background:#fff;
  border-radius:3px 10px 10px 10px;
}

.meRow{
  margin:5px 0;
  display:flex;
  justify-content:flex-end;
  align-items:flex-end;
}

.meBubble{
  background:#fee500;
  border-radius:10px 3px 10px 10px;
}

.messageTime{
  margin:0 5px 1px;
  color:#5e6971;
  font-size:9px;
  white-space:nowrap;
}

.composer{
  position:absolute;
  bottom:0;
  width:100%;
  min-height:58px;
  padding:8px 9px 12px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:7px;
}

.plusButton{
  width:31px;
  height:31px;
  border:1px solid #aaa;
  border-radius:50%;
  color:#777;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.fakeInput{
  flex:1;
  min-height:37px;
  padding:9px 13px;
  border:1px solid #ddd;
  border-radius:20px;
  color:#aaa;
  font-size:14px;
  cursor:pointer;
}

/* =========================
   CHOICES
========================= */

#choiceOverlay{
  display:none;
  position:absolute;
  inset:0;
  z-index:70;
  background:rgba(0,0,0,.22);
}

.choiceBox{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:12px 12px 28px;
  border-radius:20px 20px 0 0;
  background:#f6f6f6;
}

.choiceHandle{
  width:38px;
  height:4px;
  margin:0 auto 12px;
  border-radius:5px;
  background:#ccc;
}

.choiceLabel{
  margin-bottom:8px;
  text-align:center;
  color:#888;
  font-size:12px;
}

.choiceButton{
  width:100%;
  margin-bottom:7px;
  padding:14px 10px;
  border:0;
  border-radius:12px;
  background:#fff;
  font-size:14px;
  cursor:pointer;
}

/* =========================
   INCOMING CALL
========================= */

#incomingCall{
  display:none;
  z-index:200;
  color:white;
  background:#222;
}

.callBackground{
  position:absolute;
  inset:-20px;
  background:
    linear-gradient(rgba(15,15,15,.55),rgba(15,15,15,.75)),
    url("jaeyoon.jpg") center/cover no-repeat;
  filter:blur(18px);
  transform:scale(1.1);
}

.callLayer{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.22);
}

.incomingContent{
  position:relative;
  z-index:2;
  height:100%;
  padding-top:92px;
  text-align:center;
}

.callPhoto{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.callName{
  margin-top:18px;
  font-size:31px;
  font-weight:500;
}

.callSubtitle{
  margin-top:7px;
  color:#ddd;
  font-size:15px;
}

.incomingButtons{
  position:absolute;
  left:0;
  right:0;
  bottom:75px;
  display:flex;
  justify-content:space-around;
}

.callButtonGroup{
  font-size:13px;
}

.roundCallButton{
  width:68px;
  height:68px;
  margin-bottom:9px;
  border:0;
  border-radius:50%;
  color:#fff;
  font-size:27px;
  cursor:pointer;
}

.rejectButton{background:#ff3b30;}
.answerButton{background:#34c759;}

/* =========================
   ACTIVE CALL
========================= */

#activeCall{
  display:none;
  z-index:210;
  color:white;
  background:#222;
}

.activeBackground{
  position:absolute;
  inset:-20px;
  background:
    linear-gradient(rgba(15,15,15,.6),rgba(15,15,15,.8)),
    url("jaeyoon.jpg") center/cover no-repeat;
  filter:blur(20px);
  transform:scale(1.1);
}

.activeLayer{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.25);
}

.activeContent{
  position:relative;
  z-index:2;
  height:100%;
  padding-top:82px;
  text-align:center;
}

.activeName{
  font-size:29px;
}

#callTimer{
  margin-top:8px;
  color:#ddd;
  font-size:14px;
}

#callDialogue{
  margin:75px 25px 0;
  min-height:70px;
  padding:17px;
  border-radius:17px;
  background:rgba(0,0,0,.28);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  line-height:1.5;
}

#callChoices{
  position:absolute;
  left:15px;
  right:15px;
  bottom:125px;
}

.callChoiceButton{
  width:100%;
  margin:4px 0;
  padding:12px;
  border:0;
  border-radius:18px;
  background:rgba(255,255,255,.92);
  font-size:13px;
}

.endCallButton{
  position:absolute;
  bottom:38px;
  left:50%;
  transform:translateX(-50%);
  width:68px;
  height:68px;
  border:0;
  border-radius:50%;
  background:#ff3b30;
  color:#fff;
  font-size:27px;
}

/* =========================
   PLACEHOLDER APPS
========================= */

#otherApp{
  display:none;
  z-index:30;
  background:#f7f7f7;
}

.otherHeader{
  height:62px;
  padding:0 18px 13px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:flex-end;
}

.otherBack{
  margin-right:15px;
  font-size:29px;
  cursor:pointer;
}

.otherContent{
  padding-top:180px;
  text-align:center;
  color:#999;
}

.resetButton{
  position:absolute;
  right:15px;
  bottom:105px;
  font-size:11px;
  opacity:.65;
  cursor:pointer;
}

/* PC */

@media(min-width:600px){
  .phone{
    width:390px;
    height:844px;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    border-radius:42px;
  }

  #lockScreen.hidden{
    transform:translate(-50%,-150%);
  }
}
</style>
</head>

<body>

<!-- HOME -->
<div id="homeScreen" class="phone">

  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="appGrid">

    <div class="app" onclick="openKakao()">
      <div class="appIcon kakaoIcon">💬</div>
      <div class="appLabel">카카오톡</div>
    </div>

    <div class="app" onclick="openOtherApp('Instagram')">
      <div class="appIcon instagramIcon">◎</div>
      <div class="appLabel">Instagram</div>
    </div>

    <div class="app" onclick="openOtherApp('사진')">
      <div class="appIcon photosIcon">🌈</div>
      <div class="appLabel">사진</div>
    </div>

  </div>

  <div class="dock">

    <div class="app" onclick="openOtherApp('전화')">
      <div class="appIcon greenIcon">☎</div>
    </div>

    <div class="app" onclick="openOtherApp('메시지')">
      <div class="appIcon greenIcon">●</div>
    </div>

  </div>

  <div class="resetButton" onclick="resetGame()">처음부터</div>

</div>


<!-- KAKAO -->
<div id="kakaoScreen" class="phone">

  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="kakaoHeader">
    <h1>채팅</h1>
    <div class="kakaoTools">⌕　⚙</div>
  </div>

  <div class="chatItem" onclick="openChatRoom()">

    <img src="jaeyoon.jpg" class="profile">

    <div class="chatListText">
      <div class="chatListName">재윤이</div>

    <div class="chatListTime">지금</div>

  </div>

  <div class="kakaoBottom">
    <div class="bottomTab" onclick="closeKakao()">

      홈
    </div>

    <div class="bottomTab">
      <div class="bottomTabIcon">♙</div>
      친구
    </div>

    <div class="bottomTab">
      <div class="bottomTabIcon">●</div>
      채팅
    </div>

    <div class="bottomTab">
      <div class="bottomTabIcon">•••</div>
      더보기
    </div>
  </div>

</div>


<!-- CHAT ROOM -->
<div id="chatRoom" class="phone">

  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="roomHeader">
    <div class="backButton" onclick="closeChatRoom()">‹</div>
    <div class="roomName">재윤이</div>

    <div class="roomTools">
      <span>⌕</span>
      <span>☰</span>
    </div>
  </div>

  <div id="messages"></div>

  <div class="composer">
    <div class="plusButton">＋</div>
    <div class="fakeInput" onclick="openChoices()">메시지 입력</div>

  </div>

  <div id="choiceOverlay">
    <div class="choiceBox">

      <div class="choiceHandle"></div>

      <div class="choiceLabel">
        보낼 메시지를 선택하세요
      </div>

      <div id="choiceButtons"></div>

    </div>
  </div>

</div>


<!-- INCOMING CALL -->
<div id="incomingCall" class="phone">

  <div class="callBackground"></div>
  <div class="callLayer"></div>

  <div class="incomingContent">

    <img src="jaeyoon.jpg" class="callPhoto">

    <div class="callName">재윤이</div>
    <div class="callSubtitle">휴대전화</div>

    <div class="incomingButtons">

      <div class="callButtonGroup">
        <button
          class="roundCallButton rejectButton"
          onclick="rejectCall()">✕</button>
        <div>거절</div>

      <div class="callButtonGroup">

          class="roundCallButton answerButton"
          onclick="answerCall()">☎</button>
        <div>응답</div>
      </div>

    </div>

  </div>

</div>


<!-- ACTIVE CALL -->
<div id="activeCall" class="phone">

  <div class="activeBackground"></div>
  <div class="activeLayer"></div>

  <div class="activeContent">

    <div class="activeName">재윤이</div>
    <div id="callTimer">00:00</div>

    <div id="callDialogue">
      여보세요?
    </div>

    <div id="callChoices"></div>

    <button
      class="endCallButton"
      onclick="endCall()">☎</button>

  </div>

</div>


<!-- OTHER APPS -->
<div id="otherApp" class="phone">

  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="otherHeader">
    <span class="otherBack" onclick="closeOtherApp()">‹</span>
    <strong id="otherTitle"></strong>
  </div>

  <div class="otherContent">
    이 앱은 다음에 만들 거야 :)
  </div>

</div>


<!-- LOCK -->
<div id="lockScreen" class="phone">

  <div class="status">
    <span>SKT</span>
    <span>●●● 100%</span>
  </div>

  <div class="lockIcon">🔒</div>
  <div id="todayDate" class="lockDate"></div>
  <div class="lockTime clock">00:00</div>

  <div class="lockNotification">

    <div class="notificationTop">
      <div class="kakaoTiny">💬</div>
      카카오톡
      <span style="margin-left:auto">지금</span>
    </div>

    <div class="notificationName">재윤이</div>
    <div class="notificationMessage">OO아 자?</div>

  </div>

  <div class="lockBottom">
    <div class="swipeText">위로 쓸어올려서 잠금 해제</div>
    <div class="homeBar"></div>
  </div>

</div>


<script>

/* =========================
   CLOCK
========================= */

function updateClock(){

  const now=new Date();

  const h=String(now.getHours()).padStart(2,"0");
  const m=String(now.getMinutes()).padStart(2,"0");

  document.querySelectorAll(".clock").forEach(function(el){
    el.textContent=h+":"+m;
  });

  const days=[
    "일요일","월요일","화요일",
    "수요일","목요일","금요일","토요일"
  ];

  document.getElementById("todayDate").textContent=
    (now.getMonth()+1)+"월 "+
    now.getDate()+"일 "+
    days[now.getDay()];
}

updateClock();
setInterval(updateClock,1000);


/* =========================
   LOCK
========================= */

const lockScreen=document.getElementById("lockScreen");

let touchStart=0;

lockScreen.addEventListener("touchstart",function(e){
  touchStart=e.touches[0].clientY;
});

lockScreen.addEventListener("touchend",function(e){

  const end=e.changedTouches[0].clientY;

  if(touchStart-end>40){
    unlockPhone();
  }

});

lockScreen.addEventListener("click",unlockPhone);

function unlockPhone(){
  lockScreen.classList.add("hidden");
}


/* =========================
   NAVIGATION
========================= */

function openKakao(){
  document.getElementById("kakaoScreen").style.display="block";
}

function closeKakao(){
  document.getElementById("kakaoScreen").style.display="none";
}

function openChatRoom(){
  document.getElementById("chatRoom").style.display="block";
  initializeStory();
  renderMessages();
}

function closeChatRoom(){
  document.getElementById("chatRoom").style.display="none";
}

function openOtherApp(name){

  document.getElementById("otherTitle").textContent=name;
  document.getElementById("otherApp").style.display="block";

}

function closeOtherApp(){
  document.getElementById("otherApp").style.display="none";
}


/* =========================
   GAME DATA
========================= */

let game={
  stage:1,
  affection:0,
  movie:false,
  messages:[],
  choices:[]
};


/* =========================
   INITIAL CHAT
========================= */

function initializeStory(){

  if(game.messages.length>0){
    return;
  }

  game.messages=[
    {
      type:"date",
      text:"어제"
    },
    {
      type:"them",
      text:"OO !! 집에 잘 들어갔어?",
      time:"오후 10:48"
    },
    {
      type:"me",
      text:"ㅋㅋㅋ 웅 방금 들어왔어",
      time:"오후 10:49"
    },
    {
      type:"them",
      text:"오늘 왜 그냥 갔어..?",
      time:"오후 10:50"
    },
    {
      type:"me",
      text:"어...? 너 친구들이랑 얘기하고 있길래 그냥 왔지..ㅜ",
      time:"오후 10:51"
    },
    {
      type:"them",
      text:"그래도 말은 하고 가지...",
      time:"오후 10:52"
    },
    {
      type:"them",
      text:"기다렸는데",
      time:"오후 10:52"
    },

/* =========================
   RENDER
========================= */

function renderMessages(){

  const area=document.getElementById("messages");

  area.innerHTML="";

  game.messages.forEach(function(msg){

    if(msg.type==="date"){

      const div=document.createElement("div");

      div.className="dateLine";
      div.innerHTML="<span>"+msg.text+"</span>";

      area.appendChild(div);

      return;
    }

    if(msg.type==="me"){

      const div=document.createElement("div");

      div.className="meRow";

      div.innerHTML=
        '<div class="messageTime">'+msg.time+'</div>'+
        '<div class="meBubble">'+msg.text+'</div>';

      area.appendChild(div);

      return;
    }

    if(msg.type==="them"){

      const div=document.createElement("div");

      div.className="themRow";

      div.innerHTML=
        '<img src="jaeyoon.jpg" class="chatProfile">'+
        '<div class="themBox">'+
          '<div class="sender">재윤이</div>'+
          '<div class="bubbleLine">'+
            '<div class="themBubble">'+msg.text+'</div>'+
            '<div class="messageTime">'+msg.time+'</div>'+
          '</div>'+
        '</div>';

      area.appendChild(div);
    }

  });

  setTimeout(function(){
    area.scrollTop=area.scrollHeight;
  },50);

}


/* =========================

========================= */

function addThem(text){

  game.messages.push({

    text:text,
    time:"지금"
  });

  renderMessages();

}

function addMe(text){

  game.messages.push({

function addDate(text){

/* =========================

function openChoices(){

  if(!game.choices || game.choices.length===0){
    return;
  }

  const box=document.getElementById("choiceButtons");

  box.innerHTML="";

  game.choices.forEach(function(text,index){

    const button=document.createElement("button");

    button.className="choiceButton";
    button.textContent=text;

    button.onclick=function(){
      selectChoice(index);
    };

    box.appendChild(button);

  });

  document.getElementById("choiceOverlay").style.display="block";

}

function closeChoices(){

function preparePhoneCall(){

  game.stage=6;
  setChoices([]);

  setTimeout(function(){

  },2500);

}


let callSeconds=0;
let callInterval=null;


function answerCall(){

  document.getElementById("incomingCall").style.display="none";
  document.getElementById("activeCall").style.display="block";

  callSeconds=0;

  document.getElementById("callTimer").textContent="00:00";
  document.getElementById("callDialogue").textContent="여보세요?";
  document.getElementById("callChoices").innerHTML="";

  callInterval=setInterval(function(){

    callSeconds++;

    const minutes=
      String(Math.floor(callSeconds/60)).padStart(2,"0");

    const seconds=
      String(callSeconds%60).padStart(2,"0");

    document.getElementById("callTimer").textContent=
      minutes+":"+seconds;

  },1000);


  setTimeout(function(){

    document.getElementById("callDialogue").textContent=
      "OO아 어디쯤이야?";

    showCallChoices();

  },1300);

}


function showCallChoices(){

  const choices=[
    "나 거의 다 왔어! 왜??",

    "나 길 잘못 든 것 같아...ㅜㅜ"
  ];

  const box=document.getElementById("callChoices");

  box.innerHTML="";

  choices.forEach(function(text,index){

    const button=document.createElement("button");

    button.className="callChoiceButton";
    button.textContent=text;

    button.onclick=function(){
      selectCallChoice(index);
    };

    box.appendChild(button);

  });

}
