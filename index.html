<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Love Simulator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}
body{
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
}
button,input{font-family:inherit}
.screen{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}
.status{
  height:45px;
  flex-shrink:0;
  padding:12px 20px 0;
  display:flex;
  justify-content:space-between;
  font-size:14px;
  font-weight:600;
}

/* ==============================
   이름 설정
============================== */

#setup{
  z-index:500;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
}
.setupBox{
  width:100%;
  max-width:330px;
  text-align:center;
  transform:translateY(-25px);
}
.setupTitle{
  font-size:25px;
  font-weight:700;
  margin-bottom:10px;
}
.setupDesc{
  color:#777;
  font-size:14px;
  margin-bottom:30px;
}
#nameInput{
  width:100%;
  height:52px;
  border:1px solid #ddd;
  border-radius:15px;
  background:#f8f8f8;
  padding:0 16px;
  outline:none;
  text-align:center;
  font-size:17px;
}
.startBtn{
  width:100%;
  height:52px;
  margin-top:12px;
  border:0;
  border-radius:15px;
  background:#111;
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

/* ==============================
   잠금화면
============================== */

#lock{
  z-index:100;
  color:white;
  background:
    linear-gradient(rgba(0,0,0,.04),rgba(0,0,0,.14)),
    linear-gradient(150deg,#91b6d4,#c9bad1,#dfb7b1);
}
.lockIcon{
  text-align:center;
  margin-top:20px;
}
.lockDate{
  text-align:center;
  margin-top:25px;
  font-size:19px;
}
.lockTime{
  text-align:center;
  font-size:78px;
  font-weight:200;
  letter-spacing:-5px;
}
#notification{
  margin:45px 14px;
  padding:13px;
  border-radius:18px;
  background:rgba(245,245,245,.87);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  color:#111;
  opacity:0;
  transform:translateY(-22px);
  transition:.4s ease;
  cursor:pointer;
}
#notification.show{
  opacity:1;
  transform:translateY(0);
}
.notTop{
  display:flex;
  align-items:center;
  color:#666;
  font-size:12px;
  margin-bottom:7px;
}
.kakaoMini{
  width:23px;
  height:23px;
  margin-right:7px;
  border-radius:6px;
  background:#fee500;
  display:flex;
  justify-content:center;
  align-items:center;
}
.notName{
  font-size:15px;
  font-weight:600;
}
.notMessage{
  margin-top:3px;
  font-size:14px;
}
.unlockText{
  position:absolute;
  left:0;
  right:0;
  bottom:30px;
  text-align:center;
  font-size:13px;
}

/* ==============================
   홈
============================== */

#home{
  z-index:1;
  color:white;
  background:
    linear-gradient(rgba(0,0,0,.04),rgba(0,0,0,.14)),
    linear-gradient(150deg,#91b6d4,#c9bad1,#dfb7b1);
}
.apps{
  padding:35px 22px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px 15px;
}
.app{
  text-align:center;
  cursor:pointer;
}
.appIcon{
  width:61px;
  height:61px;
  margin:auto;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:27px;
}
.kakaoIcon{background:#fee500;color:#111}
.instagramIcon{
  background:linear-gradient(145deg,#7048ff,#db3d99,#ff963d);
}
.photoIcon{background:white}
.greenIcon{background:#34c759}
.appName{
  margin-top:6px;
  font-size:11px;
  text-shadow:0 1px 3px rgba(0,0,0,.4);
}
.dock{
  position:absolute;
  left:12px;
  right:12px;
  bottom:17px;
  height:87px;
  border-radius:27px;
  background:rgba(255,255,255,.29);
  backdrop-filter:blur(22px);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

/* ==============================
   카톡 목록
============================== */

#kakao{
  display:none;
  z-index:10;
  background:#fff;
}
.kakaoHeader{
  height:64px;
  padding:18px 18px 10px;
  display:flex;
  align-items:flex-end;
}
.kakaoHeader h1{font-size:23px}
.homeBtn{
  margin-left:auto;
  cursor:pointer;
  font-size:14px;
}
.chatItem{
  display:flex;
  align-items:center;
  padding:12px 16px;
  cursor:pointer;
}
.profile{
  width:55px;
  height:55px;
  border-radius:20px;
  object-fit:cover;
  background:#ddd;
}
.listText{
  flex:1;
  min-width:0;
  margin-left:12px;
}
.chatName{
  font-size:16px;
  font-weight:600;
}
.preview{
  margin-top:5px;
  color:#888;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ==============================
   채팅방
============================== */

#room{
  display:none;
  z-index:20;
  background:#b2c7d9;
  flex-direction:column;
}
#room.show{display:flex}
.roomHeader{
  height:56px;
  flex-shrink:0;
  padding:5px 14px;
  display:flex;
  align-items:center;
}
.back{
  width:40px;
  font-size:34px;
  cursor:pointer;
}
.roomName{
  font-size:17px;
  font-weight:600;
}
.roomTools{
  margin-left:auto;
  font-size:20px;
}
#messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:10px 12px 16px;
  -webkit-overflow-scrolling:touch;
}
.dateDivider{
  margin:10px 0 20px;
  text-align:center;
}
.dateDivider span{
  display:inline-block;
  padding:5px 12px;
  border-radius:15px;
  background:rgba(0,0,0,.12);
  color:#fff;
  font-size:11px;
}
.them{
  display:flex;
  align-items:flex-start;
  margin-bottom:10px;
}
.them img{
  width:39px;
  height:39px;
  margin-right:7px;
  border-radius:14px;
  object-fit:cover;
}
.themContent{max-width:75%}
.sender{
  margin-bottom:5px;
  font-size:12px;
}
.messageLine{
  display:flex;
  align-items:flex-end;
}
.themBubble,
.meBubble{
  max-width:245px;
  padding:8px 10px;
  font-size:14px;
  line-height:1.42;
  word-break:keep-all;
}
.themBubble{
  background:#fff;
  border-radius:3px 10px 10px 10px;
}
.me{
  display:flex;
  justify-content:flex-end;
  align-items:flex-end;
  margin:6px 0;
}
.meBubble{
  background:#fee500;
  border-radius:10px 3px 10px 10px;
}
.msgTime{
  margin:0 5px 1px;
  color:#59656d;
  font-size:9px;
  white-space:nowrap;
}

/* ==============================
   입력창
============================== */

.composer{
  min-height:64px;
  flex-shrink:0;
  padding:8px 9px max(12px,env(safe-area-inset-bottom));
  background:#fff;
  display:flex;
  align-items:center;
  gap:8px;
  position:relative;
  z-index:30;
}
.plus{
  width:31px;
  height:31px;
  flex-shrink:0;
  border:1px solid #aaa;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:22px;
}
.fakeInput{
  flex:1;
  height:39px;
  padding:9px 13px;
  border:1px solid #ddd;
  border-radius:20px;
  color:#aaa;
  font-size:14px;
  cursor:pointer;
}
.fakeInput.waiting{
  background:#f5f5f5;
  color:#bbb;
}

/* ==============================
   선택지
============================== */

#choiceOverlay{
  display:none;
  position:absolute;
  inset:0;
  z-index:80;
  background:rgba(0,0,0,.25);
}
.choicePanel{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:14px 12px max(28px,env(safe-area-inset-bottom));
  border-radius:20px 20px 0 0;
  background:#f5f5f5;
}
.choiceTitle{
  margin-bottom:9px;
  text-align:center;
  color:#888;
  font-size:12px;
}
.choiceBtn{
  width:100%;
  margin-bottom:8px;
  padding:14px 10px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-size:14px;
  cursor:pointer;
}

/* ==============================
   전화 수신
============================== */

#incomingCall{
  display:none;
  z-index:200;
  color:white;
  background:#222;
}
.callBg{
  position:absolute;
  inset:-25px;
  background:
    linear-gradient(rgba(15,15,15,.48),rgba(15,15,15,.72)),
    url("jaeyoon.jpg") center/cover;
  filter:blur(20px);
  transform:scale(1.12);
}
.callShade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.18);
}
.callContent{
  position:relative;
  z-index:2;
  height:100%;
  padding-top:90px;
  text-align:center;
}
.callPhoto{
  width:108px;
  height:108px;
  border-radius:50%;
  object-fit:cover;
}
.callName{
  margin-top:18px;
  font-size:31px;
  font-weight:500;
}
.callSub{
  margin-top:7px;
  color:#ddd;
  font-size:15px;
}
.callButtons{
  position:absolute;
  left:0;
  right:0;
  bottom:75px;
  display:flex;
  justify-content:space-around;
}
.callGroup{font-size:13px}
.callRound{
  width:68px;
  height:68px;
  margin-bottom:9px;
  border:0;
  border-radius:50%;
  color:white;
  font-size:27px;
  cursor:pointer;
}
.reject{background:#ff3b30}
.answer{background:#34c759}

/* ==============================
   통화 중
============================== */

#activeCall{
  display:none;
  z-index:210;
  color:white;
  background:#222;
}
.activeBg{
  position:absolute;
  inset:-25px;
  background:
    linear-gradient(rgba(15,15,15,.55),rgba(15,15,15,.78)),
    url("jaeyoon.jpg") center/cover;
  filter:blur(20px);
  transform:scale(1.12);
}
.activeShade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.22);
}
.activeContent{
  position:relative;
  z-index:2;
  height:100%;
  padding-top:80px;
  text-align:center;
}
.activeName{font-size:29px}
#callTimer{
  margin-top:8px;
  color:#ddd;
  font-size:14px;
}
#callDialogue{
  margin:70px 25px 0;
  min-height:72px;
  padding:17px;
  border-radius:17px;
  background:rgba(0,0,0,.28);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:16px;
  line-height:1.5;
}
#callChoices{
  position:absolute;
  left:15px;
  right:15px;
  bottom:125px;
}
.callChoice{
  width:100%;
  margin:4px 0;
  padding:12px;
  border:0;
  border-radius:18px;
  background:rgba(255,255,255,.92);
  color:#111;
  font-size:13px;
}
.endCall{
  position:absolute;
  left:50%;
  bottom:38px;
  transform:translateX(-50%);
  width:68px;
  height:68px;
  border:0;
  border-radius:50%;
  background:#ff3b30;
  color:white;
  font-size:27px;
}

/* 다른 앱 */

#other{
  display:none;
  z-index:30;
  background:#f7f7f7;
}
.otherHeader{
  height:62px;
  padding:0 18px 13px;
  background:white;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:flex-end;
}
.otherBody{
  padding-top:180px;
  text-align:center;
  color:#999;
}

@media(min-width:600px){
  .screen{
    width:390px;
    height:844px;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    border-radius:42px;
  }
}
</style>
</head>

<body>

<!-- 이름 설정 -->
<div id="setup" class="screen">
  <div class="setupBox">
    <div class="setupTitle">이름을 알려주세요💕</div>
    <div class="setupDesc">최애가 이 이름으로 당신을 부릅니다.</div>

    <input id="nameInput" maxlength="10" placeholder="이름" autocomplete="off">

    <button class="startBtn" onclick="startGame()">
      시작하기
    </button>
  </div>
</div>

<!-- 홈 -->
<div id="home" class="screen">
  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="apps">
    <div class="app" onclick="openKakao()">
      <div class="appIcon kakaoIcon">💬</div>
      <div class="appName">카카오톡</div>
    </div>

    <div class="app" onclick="openOther('Instagram')">
      <div class="appIcon instagramIcon">◎</div>
      <div class="appName">Instagram</div>
    </div>

    <div class="app" onclick="openOther('사진')">
      <div class="appIcon photoIcon">🌈</div>
      <div class="appName">사진</div>
    </div>
  </div>

  <div class="dock">
    <div class="app" onclick="openOther('전화')">
      <div class="appIcon greenIcon">☎</div>
    </div>

    <div class="app" onclick="openOther('메시지')">
      <div class="appIcon greenIcon">●</div>
    </div>
  </div>
</div>

<!-- 카톡 목록 -->
<div id="kakao" class="screen">
  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="kakaoHeader">
    <h1>채팅</h1>
    <div class="homeBtn" onclick="goHome()">홈</div>
  </div>

  <div class="chatItem" onclick="openRoom()">
    <img src="jaeyoon.jpg" class="profile">

    <div class="listText">
      <div class="chatName">재윤이</div>
      <div id="preview" class="preview">물어볼 게 있는데..</div>
    </div>
  </div>
</div>

<!-- 채팅방 -->
<div id="room" class="screen">
  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="roomHeader">
    <div class="back" onclick="backList()">‹</div>
    <div class="roomName">재윤이</div>
    <div class="roomTools">⌕　☰</div>
  </div>

  <div id="messages"></div>

  <div class="composer">
    <div class="plus">＋</div>

    <div id="messageInput" class="fakeInput" onclick="openChoices()">
      메시지 입력
    </div>

    <div>☺</div>
    <div>#</div>
  </div>

  <div id="choiceOverlay">
    <div class="choicePanel">
      <div class="choiceTitle">보낼 메시지를 선택하세요</div>
      <div id="choiceButtons"></div>
    </div>
  </div>
</div>

<!-- 전화 수신 -->
<div id="incomingCall" class="screen">
  <div class="callBg"></div>
  <div class="callShade"></div>

  <div class="callContent">
    <img src="jaeyoon.jpg" class="callPhoto">

    <div class="callName">재윤이</div>
    <div class="callSub">휴대전화</div>

    <div class="callButtons">
      <div class="callGroup">
        <button class="callRound reject" onclick="rejectCall()">✕</button>
        <div>거절</div>
      </div>

      <div class="callGroup">
        <button class="callRound answer" onclick="answerCall()">☎</button>
        <div>응답</div>
      </div>
    </div>
  </div>
</div>

<!-- 통화 -->
<div id="activeCall" class="screen">
  <div class="activeBg"></div>
  <div class="activeShade"></div>

  <div class="activeContent">
    <div class="activeName">재윤이</div>
    <div id="callTimer">00:00</div>

    <div id="callDialogue">여보세요?</div>
    <div id="callChoices"></div>

    <button class="endCall" onclick="endCall()">☎</button>
  </div>
</div>

<!-- 기타 앱 -->
<div id="other" class="screen">
  <div class="status">
    <span class="clock">00:00</span>
    <span>●●● 100%</span>
  </div>

  <div class="otherHeader">
    <span onclick="closeOther()" style="font-size:28px;margin-right:15px;cursor:pointer">‹</span>
    <strong id="otherTitle"></strong>
  </div>

  <div class="otherBody">
    이 앱은 다음에 만들 거야 :)
  </div>
</div>

<!-- 잠금화면 -->
<div id="lock" class="screen">
  <div class="status">
    <span>SKT</span>
    <span>●●● 100%</span>
  </div>

  <div class="lockIcon">🔒</div>
  <div id="lockDate" class="lockDate"></div>
  <div class="lockTime clock">00:00</div>

  <div id="notification">
    <div class="notTop">
      <div class="kakaoMini">💬</div>
      카카오톡
      <span style="margin-left:auto">지금</span>
    </div>

    <div class="notName">재윤이</div>
    <div id="notificationText" class="notMessage"></div>
  </div>

  <div class="unlockText">
    화면을 눌러 잠금 해제
  </div>
</div>

<script>
/* ==============================
   게임 상태
============================== */

let userName = "";
let calledName = "";

let stage = "first";
let currentChoices = [];
let waiting = false;
let storyStarted = false;

let audioContext = null;
let callInterval = null;
let callSeconds = 0;

/* ==============================
   이름
============================== */

function getCalledName(name){
  if(!name) return "";

  const code = name.charCodeAt(name.length - 1);

  if(code >= 0xAC00 && code <= 0xD7A3){
    const hasBatchim = (code - 0xAC00) % 28 !== 0;
    return hasBatchim ? name + "아" : name + "야";
  }

  return name + "아";
}

function startGame(){
  const value = document.getElementById("nameInput").value.trim();

  if(!value){
    alert("이름을 입력해주세요.");
    return;
  }

  userName = value;
  calledName = getCalledName(userName);

  prepareAudio();

  document.getElementById("setup").style.display = "none";

  document.getElementById("notificationText").textContent =
    calledName + " 자?";

  initializeChat();

  setTimeout(function(){
    playNotificationSound();
    document.getElementById("notification").classList.add("show");
  }, 2000);
}

/* ==============================
   알림음
============================== */

function prepareAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;

    if(!AC) return;

    if(!audioContext){
      audioContext = new AC();
    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }
  }catch(e){}
}

function playNotificationSound(){
  try{
    if(!audioContext) return;

    const now = audioContext.currentTime;

    makeTone(880, now, .13, .12);
    makeTone(1175, now + .15, .18, .10);

  }catch(e){}
}

function makeTone(freq,start,duration,volume){
  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.type = "sine";
  osc.frequency.setValueAtTime(freq,start);

  gain.gain.setValueAtTime(.0001,start);
  gain.gain.exponentialRampToValueAtTime(volume,start+.015);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);

  osc.connect(gain);
  gain.connect(audioContext.destination);

  osc.start(start);
  osc.stop(start+duration+.02);
}

/* ==============================
   최초 대화
============================== */

function initializeChat(){
  if(storyStarted) return;

  storyStarted = true;

  const area = document.getElementById("messages");

  area.innerHTML = "";

  addDate("어제",false);

  addThem(userName + " !! 집에 잘 들어갔어?","오후 10:48",false);
  addMe("ㅋㅋㅋ 웅 방금 들어왔어","오후 10:49",false);
  addThem("오늘 왜 그냥 갔어..?","오후 10:50",false);
  addMe("어...? 너 친구들이랑 얘기하고 있길래 그냥 왔지..ㅜ","오후 10:51",false);
  addThem("그래도 말은 하고 가지...","오후 10:52",false);
  addThem("기다렸는데","오후 10:52",false);

  addDate("오늘",false);

  addThem(calledName + " 자?","오후 11:41",false);
  addThem("물어볼 게 있는데..","오후 11:42",false);

  stage = "first";

  setChoices([
    "웅?? 아직까지 안 자고 뭐해 ㅋㅋㅋ",

/* ==============================

============================== */

function addDate(text,scroll=true){
  const area = document.getElementById("messages");

  const div = document.createElement("div");
  div.className = "dateDivider";
  div.innerHTML = "<span>" + text + "</span>";

  area.appendChild(div);

  if(scroll) scrollBottom();
}

function addMe(text,time="지금",scroll=true){
  const area = document.getElementById("messages");

  const div = document.createElement("div");
  div.className = "me";

  div.innerHTML =
    '<div class="msgTime">' + time + '</div>' +
    '<div class="meBubble">' + text + '</div>';

  area.appendChild(div);

  document.getElementById("preview").textContent = text;

  if(scroll) scrollBottom();
}

function addThem(text,time="지금",scroll=true){
  const area = document.getElementById("messages");

  const div = document.createElement("div");
  div.className = "them";

  div.innerHTML =
    '<img src="jaeyoon.jpg">' +
    '<div class="themContent">' +
      '<div class="sender">재윤이</div>' +
      '<div class="messageLine">' +
        '<div class="themBubble">' + text + '</div>' +
        '<div class="msgTime">' + time + '</div>' +
      '</div>' +
    '</div>';

  area.appendChild(div);

  document.getElementById("preview").textContent = text;

  if(scroll) scrollBottom();
}

function scrollBottom(){
  setTimeout(function(){
    const area = document.getElementById("messages");
    area.scrollTop = area.scrollHeight;
  },50);
}

/* ==============================
   선택지 시스템
============================== */

function setChoices(array){
  currentChoices = array || [];
  waiting = false;

  const input = document.getElementById("messageInput");

  if(currentChoices.length){
    input.textContent = "메시지 입력";
    input.classList.remove("waiting");
  }else{
    input.textContent = "답장을 기다리는 중...";
    input.classList.add("waiting");
  }
}

function lockInput(){
  currentChoices = [];
  waiting = true;

  const input = document.getElementById("messageInput");
  input.textContent = "답장을 기다리는 중...";
  input.classList.add("waiting");
}

function openChoices(){
  if(waiting || !currentChoices.length) return;

  const box = document.getElementById("choiceButtons");
  box.innerHTML = "";

  currentChoices.forEach(function(text,index){
    const button = document.createElement("button");

    button.className = "choiceBtn";
    button.textContent = text;

    button.onclick = function(){
      selectChoice(index);
    };

    box.appendChild(button);
  });

  document.getElementById("choiceOverlay").style.display = "block";
}

function closeChoices(){
  document.getElementById("choiceOverlay").style.display = "none";
}

function selectChoice(index){
  if(waiting) return;

  const text = currentChoices[index];

  closeChoices();
  lockInput();

  addMe(text);

  runStage(stage,index);
}

/* ==============================
   메시지 순차 전송
============================== */

function sequence(items,finished){
  let total = 0;

  items.forEach(function(item){
    total += item.delay;

    setTimeout(function(){
      if(item.type === "them"){
        addThem(item.text);
      }

      if(item.type === "me"){
        addMe(item.text);
      }

      if(item.type === "date"){
        addDate(item.text);
      }
    },total);
  });

  setTimeout(function(){
    if(finished) finished();
  },total + 400);
}

function incomingPhoneCall(){
  stage = "call";
  lockInput();

  setTimeout(function(){
    playNotificationSound();
    document.getElementById("incomingCall").style.display = "block";
  },2500);
}

function rejectCall(){
  document.getElementById("incomingCall").style.display = "none";

  sequence([
    {type:"them",text:"왜 안 받아 ㅋㅋㅋ",delay:1800},
    {type:"them",text:"어디쯤이야?",delay:2300}
  ],function(){
    stage = "afterReject";
    setChoices([]);
    document.getElementById("messageInput").textContent = "계속...";
  });
}

function answerCall(){
  document.getElementById("incomingCall").style.display = "none";
  document.getElementById("activeCall").style.display = "block";

  callSeconds = 0;
  document.getElementById("callTimer").textContent = "00:00";
  document.getElementById("callDialogue").textContent = "여보세요?";
  document.getElementById("callChoices").innerHTML = "";

  if(callInterval) clearInterval(callInterval);

  callInterval = setInterval(function(){
    callSeconds++;

    const m = String(Math.floor(callSeconds/60)).padStart(2,"0");
    const s = String(callSeconds%60).padStart(2,"0");

    document.getElementById("callTimer").textContent = m + ":" + s;
  },1000);

  setTimeout(function(){
    document.getElementById("callDialogue").textContent =
      calledName + " 어디쯤이야?";

    showCallChoices();
  },1800);
}

function showCallChoices(){
  const choices = [
    "나 거의 다 왔어! 왜??",
    "ㅋㅋㅋㅋ 왜 벌써 전화해",
    "나 길 잘못 든 것 같아...ㅜㅜ"
  ];

  const box = document.getElementById("callChoices");
  box.innerHTML = "";

  choices.forEach(function(text,index){
    const button = document.createElement("button");

    button.className = "callChoice";
    button.textContent = text;

    button.onclick = function(){
      chooseCall(index);
    };

    box.appendChild(button);
  });
}

function chooseCall(index){
  document.getElementById("callChoices").innerHTML = "";

  if(index === 0){
    callDialogueSequence([
      ["아 진짜?",0],
      ["아니 그냥 어디쯤 왔나 궁금해서 ㅎㅎ",2200],
      ["그럼 끊지 말고 와",2600]
    ]);
  }

  if(index === 1){
    callDialogueSequence([
      ["아니 ㅋㅋㅋㅋ",0],
      ["심심하잖아",2100],
      ["올 때까지 통화해 ㅎㅎ",2500]
    ]);
  }

  if(index === 2){
    callDialogueSequence([
      ["어??",0],
      ["지금 어디야?",1800],
      ["잠깐만 내가 그쪽으로 갈게",2300],
      ["끊지 마",2100]
    ]);
  }
}

function callDialogueSequence(items){
  let total = 0;

  items.forEach(function(item){
    total += item[1];

    setTimeout(function(){
      document.getElementById("callDialogue").textContent = item[0];
    },total);
  });
}

function endCall(){
  if(callInterval){
    clearInterval(callInterval);
    callInterval = null;
  }

  document.getElementById("activeCall").style.display = "none";
}

/* ==============================
   시간
============================== */

function updateClock(){
  const now = new Date();

  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");

  document.querySelectorAll(".clock").forEach(function(el){
    el.textContent = h + ":" + m;
  });

  const days = [
    "일요일","월요일","화요일",
    "수요일","목요일","금요일","토요일"
  ];

  document.getElementById("lockDate").textContent =
    (now.getMonth()+1) + "월 " +
    now.getDate() + "일 " +
    days[now.getDay()];
}

updateClock();
setInterval(updateClock,1000);

document.getElementById("nameInput").addEventListener("keydown",function(e){
  if(e.key === "Enter"){
    startGame();
  }
});
